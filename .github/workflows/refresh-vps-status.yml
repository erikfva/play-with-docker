name: Refresh VPS Status

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Filter by provider (all by default)'
        type: choice
        required: false
        default: all
        options:
          - all
          - gcs
          - codesandbox
          - codespaces
      vps-id:
        description: 'Single VPS ID to refresh (optional)'
        type: string
        required: false
      force:
        description: 'Bypass TTL cache and force provider API call'
        type: boolean
        required: false
        default: false

jobs:
  refresh-vps-status:
    name: Refresh VPS Credential Status
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh VPS Status
        env:
          SERVER_TOKEN: ${{ secrets.SERVER_TOKEN }}
          PWD_API_URL: ${{ secrets.PWD_API_URL }}
        run: |
          ARGS=(--json)
          [ -n "$INPUT_PROVIDER" ] && [ "$INPUT_PROVIDER" != "all" ] && ARGS+=(--provider "$INPUT_PROVIDER")
          [ -n "$INPUT_VPS_ID" ] && ARGS+=(--id "$INPUT_VPS_ID")
          [ "$INPUT_FORCE" = "true" ] && ARGS+=(--force)
          node scripts/refresh-vps-status.js "${ARGS[@]}"
        shell: bash