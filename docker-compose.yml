services:
  app:
    build:
      context: .
      args:
        NODE_ENV: local
    image: erikvargas/play-with-docker:latest
    volumes:
      - ./credentials:/mnt/s3:ro
      - ./src:/app/src
    network_mode: host
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    command: ["npm", "run", "dev"]
    restart: unless-stopped
