services:
  app:
    build: .
    image: erikvargas/play-with-docker:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    environment:
      # Container path must be absolute for Google auth libraries.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:?set GOOGLE_APPLICATION_CREDENTIALS}
    restart: unless-stopped
