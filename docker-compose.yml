services:
  app:
    build:
      context: .
      args:
        NODE_ENV: local
    image: erikvargas/play-with-docker:latest
    shm_size: 2g
    init: true
    volumes:
      # Read-write (not :ro) so codesandbox-auth.js can write refreshed
      # Playwright storageState files (credentials/codesandbox-web/*.json)
      # back to the host when run inside the container via docker exec.
      # CLI scraper scripts that need to update session files require write
      # access; the application itself never writes to this directory.
      - ./credentials:/mnt/s3
      - ./src:/app/src
      - ./scripts:/app/scripts
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    command: ["npm", "run", "dev"]
    restart: unless-stopped
