services:
  app:
    build: .
    image: erikvargas/play-with-docker:latest
    ports:
      - "${PORT:-3000}:3000"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    volumes:
      # Use the same absolute path for host and container.
      - ${GOOGLE_APPLICATION_CREDENTIALS:?set GOOGLE_APPLICATION_CREDENTIALS}:${GOOGLE_APPLICATION_CREDENTIALS}:ro
    restart: unless-stopped
