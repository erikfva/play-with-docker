services:
  app:
    build:
      context: .
      args:
        NODE_ENV: local
    image: erikvargas/play-with-docker:latest
    shm_size: 2g
    init: true
    volumes:
      - ./credentials:/mnt/s3:ro
      - ./src:/app/src
      - ./scripts:/app/scripts
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    command: ["npm", "run", "dev"]
    restart: unless-stopped
