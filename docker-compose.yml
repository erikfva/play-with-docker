services:
  app:
    build: .
    image: erikvargas/play-with-docker:latest
    volumes:
      - ./credentials:/mnt/s3:ro
      - ./:/app
      - /app/node_modules
    ports:
      - "${PORT:-3000}:3000"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    command: ["npm", "run", "dev"]
    restart: unless-stopped
